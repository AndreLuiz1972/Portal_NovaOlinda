 <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transparência</title>
    <style>
        /* Zera as margens e paddings padrão do navegador */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Garante que o corpo da página ocupe 100% da largura sem espaços */
        html, body {
            width: 100%;
            margin: 0;
            padding: 0;
        }

        /* Faz o iframe grudar no topo e nas laterais */
        .cabecalho-frame {
            width: 100%;
            height: 400px;
            border: none;
            display: block; /* Remove o pequeno espaço em branco que fica abaixo do iframe */
        }
    </style>
</head>
<body>

    <iframe src="/cabecalho.html" class="cabecalho-frame"></iframe>

</body>
</html>
